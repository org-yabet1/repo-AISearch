name: Deploy Azure AI Search

on:
  workflow_dispatch:
    inputs:
      resourceGroupName:
        description: Resource group name to create or reuse
        required: true
        type: string
      location:
        description: Azure region for the resource group and search service
        required: true
        default: koreacentral
        type: string
      searchServiceName:
        description: Azure AI Search service name
        required: true
        type: string
      sku:
        description: Azure AI Search SKU
        required: true
        default: basic
        type: choice
        options:
          - free
          - basic
          - standard
          - standard2
          - standard3
      replicaCount:
        description: Number of replicas
        required: true
        default: "1"
        type: string
      partitionCount:
        description: Number of partitions
        required: true
        default: "1"
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group
        uses: azure/cli@v2
        with:
          inlineScript: |
            az group create \
              --name "${{ inputs.resourceGroupName }}" \
              --location "${{ inputs.location }}"

      - name: Deploy Azure AI Search service
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ inputs.resourceGroupName }}
          template: ./infra/azure-ai-search.json
          deploymentName: azure-ai-search-${{ github.run_number }}
          parameters: >
            searchServiceName=${{ inputs.searchServiceName }}
            location=${{ inputs.location }}
            sku=${{ inputs.sku }}
            replicaCount=${{ inputs.replicaCount }}
            partitionCount=${{ inputs.partitionCount }}
